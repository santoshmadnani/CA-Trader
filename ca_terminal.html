<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CA Trader Terminal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
/* Layout: fixed app shell with slim chrome. Desktop: 46px header | watchlist rail + workspace (signal web + calls, chart + feed, desk).
   Phone: 46px header | one view | 52px tab bar. One theme for every surface. */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f4f6fa; --surface-3:#e8ecf3; --line:#dfe4ec; --fg:#111827; --muted:#667085;
  --accent:#2f6bf0; --accent-2:#7c5cff; --accent-soft:rgba(47,107,240,.12);
  --up:#0a9d7a; --down:#e5384a; --warn:#c98200; --up-soft:rgba(10,157,122,.13); --down-soft:rgba(229,56,74,.12);
  --web-bg:#f7f9fc; --shadow:0 1px 2px rgba(16,24,40,.06);
  --font-ui:"Plus Jakarta Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-num:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#06080d; --surface:#0d1119; --surface-2:#121824; --surface-3:#19202e; --line:#1d2533; --fg:#e5e9f2; --muted:#7f8aa0;
  --accent:#5b8cff; --accent-2:#9b7bff; --accent-soft:rgba(91,140,255,.15);
  --up:#22c39a; --down:#ff5468; --warn:#f0b43c; --up-soft:rgba(34,195,154,.15); --down-soft:rgba(255,84,104,.14);
  --web-bg:#05070c; --shadow:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#06080d; --surface:#0d1119; --surface-2:#121824; --surface-3:#19202e; --line:#1d2533; --fg:#e5e9f2; --muted:#7f8aa0;
  --accent:#5b8cff; --accent-2:#9b7bff; --accent-soft:rgba(91,140,255,.15);
  --up:#22c39a; --down:#ff5468; --warn:#f0b43c; --up-soft:rgba(34,195,154,.15); --down-soft:rgba(255,84,104,.14);
  --web-bg:#05070c; --shadow:none; color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app{position:relative;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
.hdr{display:flex;align-items:center;gap:10px;height:46px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700;flex:none}
.brand{font-weight:700;font-size:14px;white-space:nowrap}
.ticker{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.ticker::-webkit-scrollbar{display:none}
.tk{display:flex;align-items:baseline;gap:5px;padding:3px 9px;border-radius:999px;background:var(--surface-2);white-space:nowrap;font-size:11.5px}
.tk .n{color:var(--muted);font-weight:600;font-size:10.5px}
.tk .v{font-weight:600}
.status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--up)} .dot.off{background:var(--down)} .dot.idle{background:var(--warn)}
.icon-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:hover{border-color:var(--accent)}
@media (max-width:760px){.brand,.status-txt,#pauseBtn,#sess{display:none}.toasts{display:none!important}}

.banner{position:absolute;left:50%;top:54px;transform:translateX(-50%);z-index:40;display:flex;gap:10px;align-items:flex-start;max-width:min(560px,calc(100% - 24px));padding:9px 12px;border-radius:10px;border:1px solid var(--down);background:var(--surface);font-size:12.5px}
.banner button{border:0;background:transparent;cursor:pointer;color:var(--muted)}
.toasts{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:14px;z-index:45;display:grid;gap:8px;width:min(340px,calc(100% - 24px));pointer-events:none}
.toast{pointer-events:auto;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:9px 12px;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:tin .25s ease-out}
.toast.warn{border-left-color:var(--warn)} .toast.good{border-left-color:var(--up)} .toast.bad{border-left-color:var(--down)}
.toast b{display:block;font-size:12px;margin-bottom:2px}
@keyframes tin{from{transform:translateY(8px);opacity:0}}

.content{min-height:0;display:grid;grid-template-columns:270px minmax(0,1fr);gap:10px;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px))}
.pane{min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--surface-3) transparent}
.main{display:grid;gap:10px;align-content:start;grid-template-columns:minmax(0,1fr) 320px;grid-template-areas:"web web" "recs recs" "chart feed" "desk feed";grid-template-rows:repeat(4,max-content)}
.sec-web{grid-area:web} .sec-chart{grid-area:chart} .sec-feed{grid-area:feed;display:flex;flex-direction:column;gap:10px;min-width:0} .sec-desk{grid-area:desk}
@media (max-width:1240px){.main{grid-template-columns:minmax(0,1fr);grid-template-areas:"web" "recs" "chart" "desk" "feed";grid-template-rows:repeat(5,max-content)}.sec-feed{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}}
@media (max-width:980px){.content{grid-template-columns:230px minmax(0,1fr)}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0;overflow:clip}
.card-h{display:flex;align-items:center;gap:8px;padding:8px 12px;min-height:40px;flex-wrap:wrap}
.card-h h2{font-size:13px;font-weight:700;margin:0}
.card-h .sub{font-size:11px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--muted);font-size:12px;padding:16px 12px;text-align:center}
.err{color:var(--down);font-size:12px;padding:10px 12px}
.skel{height:11px;border-radius:6px;background:var(--surface-2)}
.seg{display:inline-flex;padding:2px;gap:2px;border-radius:8px;background:var(--surface-2);overflow-x:auto;scrollbar-width:none;max-width:100%}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:transparent;padding:4px 9px;border-radius:6px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.15)}

/* watchlist */
.wl-card{height:100%;display:flex;flex-direction:column}
.search{position:relative;padding:0 10px 8px}
.sbox{display:flex;align-items:center;gap:7px;padding:0 10px;height:34px;border-radius:9px;background:var(--surface-2);color:var(--muted)}
.sbox input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;outline:none}
.results{position:absolute;left:10px;right:10px;top:calc(100% - 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 16px 36px rgba(0,0,0,.25);z-index:30;max-height:320px;overflow:auto}
.res{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;border-bottom:1px solid var(--line)}
.res:hover{background:var(--accent-soft)}
.res .t{font-size:10px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.wl-list{flex:1;overflow:auto;padding:0 6px 6px}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;padding:8px;border-radius:9px;cursor:pointer;position:relative}
.wrow:hover{background:var(--surface-2)} .wrow.sel{background:var(--accent-soft)}
.wrow .s{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .l{text-align:right;font-weight:600}
.wrow .nm{font-size:10.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .ch{font-size:10.5px;text-align:right}
.wrow .x{position:absolute;right:4px;top:4px;opacity:0;border:0;background:var(--surface-3);cursor:pointer;color:var(--muted);width:18px;height:18px;border-radius:5px;font-size:9px}
.wrow:hover .x{opacity:1}
.flash-up{background:var(--up-soft)!important} .flash-down{background:var(--down-soft)!important}

/* signal web + calls */
.web-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px}
@media (max-width:1100px){.web-grid{grid-template-columns:minmax(0,1fr)}}
.web-wrap{position:relative;height:440px;background:var(--web-bg);border-top:1px solid var(--line)}
#web{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
.web-tools{position:absolute;right:8px;top:8px;z-index:3;display:flex;gap:6px}
.web-tools .seg{background:var(--surface);border:1px solid var(--line)}
.web-foot{position:absolute;left:10px;bottom:8px;z-index:3;font-family:var(--font-num);font-size:10px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;pointer-events:none;white-space:nowrap;overflow:hidden;max-width:calc(100% - 20px)}
.tip{position:absolute;pointer-events:none;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 28px rgba(0,0,0,.25);padding:7px 9px;font-size:11.5px;max-width:250px}
.tip b{display:block;font-size:12px;margin-bottom:2px}
.side{border-left:1px solid var(--line);border-top:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
@media (max-width:1100px){.side{border-left:0}}
.model{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.vbadge{font-size:15px;font-weight:700;letter-spacing:.04em;padding:5px 11px;border-radius:8px;min-width:64px;text-align:center}
.vbadge.buy{background:var(--up-soft);color:var(--up)} .vbadge.sell{background:var(--down-soft);color:var(--down)} .vbadge.hold{background:var(--surface-2);color:var(--muted)}
.vmeta{font-size:11px;color:var(--muted);display:grid;gap:1px;min-width:0}
.vmeta b{color:var(--fg);font-weight:600}
.call{padding:10px 12px;display:grid;gap:8px}
.call-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.call-h .k{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cbadge{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px}
.cbadge.buy{background:var(--up-soft);color:var(--up)} .cbadge.sell{background:var(--down-soft);color:var(--down)} .cbadge.none{background:var(--surface-2);color:var(--muted)}
.cd{margin-left:auto;font-family:var(--font-num);font-size:11px;color:var(--muted)}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lv{background:var(--surface-2);border-radius:8px;padding:6px 8px;min-width:0}
.lv .k{font-size:10px;color:var(--muted);font-weight:600}
.lv .v{font-weight:600;font-size:12.5px}
.lv .p{font-size:10.5px}
.cstat{display:flex;gap:8px;align-items:center;font-size:11.5px;flex-wrap:wrap}
.pill{font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.pill.good{background:var(--up-soft);color:var(--up)} .pill.bad{background:var(--down-soft);color:var(--down)} .pill.warn{background:rgba(201,130,0,.15);color:var(--warn)}
.clog{display:grid;gap:4px;max-height:132px;overflow:auto;font-size:11.5px}
.clog div{padding:5px 8px;border-radius:7px;background:var(--surface-2)}
.clog .t{font-family:var(--font-num);color:var(--muted);margin-right:6px}
.note{font-size:10.5px;color:var(--muted);line-height:1.45}

/* chart */
.sym-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
.sym-h .sym{font-size:14px;font-weight:700}
.sym-h .ltp{font-size:16px;font-weight:600}
.chart-h .seg{margin-left:auto}
.chart-wrap{position:relative;height:420px;border-top:1px solid var(--line)}
#chart{position:absolute;inset:0}
.legend{position:absolute;left:10px;top:8px;z-index:3;font-size:11px;display:flex;gap:9px;flex-wrap:wrap;pointer-events:none}
.legend b{font-weight:500;color:var(--muted)}
.chart-msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:12px;z-index:2;background:var(--surface)}
.ohlc-row{display:flex;gap:14px;flex-wrap:wrap;padding:7px 12px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.ohlc-row b{color:var(--fg);font-weight:500}
.pat-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:7px 12px 9px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.pat-tg,.pat-chip{font:inherit;font-size:11px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:3px 9px;cursor:pointer}
.pat-tg[aria-pressed=false]{color:var(--muted)}
.pat-chip.up{color:var(--up)}.pat-chip.down{color:var(--down)}
.pat-chip.ok{border-color:currentColor}
.pat-chip[aria-pressed=true]{background:color-mix(in srgb,currentColor 12%,transparent)}
.pat-st{padding:3px 4px}.pat-st.up{color:var(--up)}.pat-st.down{color:var(--down)}
.pat-detail{flex-basis:100%;line-height:1.5;color:var(--fg);padding:4px 2px 0}
.pat-detail span{color:var(--muted)}

/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{font-weight:600;color:var(--muted);text-align:right;padding:6px 10px;border-bottom:1px solid var(--line);font-size:10.5px;white-space:nowrap}
td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child{text-align:left}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
.depth{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:2px 12px 8px}
@media (max-width:560px){.depth{grid-template-columns:1fr}}
.dside td{position:relative}
.dbar{position:absolute;top:3px;bottom:3px;right:0;border-radius:4px}
.dside td span{position:relative;z-index:1}
.imb{padding:0 12px 12px}
.imb-bar{height:6px;border-radius:3px;background:var(--down);overflow:hidden}
.imb-bar i{display:block;height:100%;background:var(--up)}
.imb-l{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:5px}
.oc-meta{display:flex;gap:14px;flex-wrap:wrap;padding:2px 12px 8px;font-size:11px;color:var(--muted)}
.oc-meta b{color:var(--fg);font-weight:600}
.oc td.strike{text-align:center;font-weight:700;background:var(--surface-2)}
.oc tr.atm td{background:var(--accent-soft)}
.oibar{display:inline-block;height:5px;border-radius:3px;vertical-align:middle;margin:0 6px;opacity:.8}
.oc th.c{text-align:center}
.pf-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;padding:2px 12px 10px}
.sub-h{font-size:12px;font-weight:700;padding:8px 12px 4px;border-top:1px solid var(--line)}
.news-i{padding:8px 12px;border-top:1px solid var(--line);display:grid;gap:3px}
.news-i a{color:var(--fg);text-decoration:none;font-weight:600}
.news-i a:hover{color:var(--accent)}
.tag{font-size:10px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.tag.pos{color:var(--up);background:var(--up-soft)} .tag.neg{color:var(--down);background:var(--down-soft)}

/* phone */
.tabbar{display:none}
@media (max-width:760px){
  .content{grid-template-columns:minmax(0,1fr);padding-block:8px}
  .main{display:block;height:100%}
  .app[data-view="watch"] .main,.app:not([data-view="watch"]) .wl-pane{display:none}
  .main>section{display:none;margin-bottom:10px}
  .app[data-view="signal"] .sec-web,.app[data-view="chart"] .sec-chart,.app[data-view="desk"] .sec-desk,.app[data-view="recs"] .sec-recs{display:block}
  .app[data-view="feed"] .sec-feed{display:flex}
  .app[data-view="chart"] .main{display:flex;flex-direction:column}
  .app[data-view="chart"] .sec-chart{display:flex;flex-direction:column;flex:1;min-height:380px;margin:0}
  .app[data-view="chart"] .chart-wrap{flex:1;height:auto;min-height:280px}
  .web-wrap{height:min(58vh,520px)}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);height:calc(52px + env(safe-area-inset-bottom,0px));padding:4px max(6px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(6px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1px solid var(--line)}
  .tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:10px;font-weight:600;cursor:pointer}
  .tabbar button[aria-selected="true"]{color:var(--accent)}
}

/* tick feedback */
.tk .v.tick-up,.wrow .l.tick-up{animation:tickUp .5s ease-out}.tk .v.tick-dn,.wrow .l.tick-dn{animation:tickDn .5s ease-out}
@keyframes tickUp{0%{transform:translateY(5px);opacity:.4;color:var(--up)}}
@keyframes tickDn{0%{transform:translateY(-5px);opacity:.4;color:var(--down)}}

/* signal web full screen */
.app.webfs .sec-web{position:fixed;inset:0;z-index:95;border-radius:0;display:flex;flex-direction:column}
.app.webfs .sec-web .web-grid{flex:1;min-height:0}
.app.webfs .web-wrap{height:100%}
.app.webfs .side{overflow:auto}
@media (max-width:760px){.app.webfs .sec-web{display:flex!important}.app.webfs .web-grid{grid-template-rows:minmax(0,1fr) auto}.app.webfs .side{max-height:40vh}}
.web-tools .icon-btn{width:30px;height:30px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)} .btn:disabled{opacity:.5;cursor:default}
.btn.buy{background:var(--up);border-color:var(--up);color:#fff} .btn.sell{background:var(--down);border-color:var(--down);color:#fff}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:3px 8px;font-size:11px}
.call-actions{display:flex;gap:6px;flex-wrap:wrap}
.lv.dim .v{color:var(--muted)}

/* recommendations log */
.sec-recs{grid-area:recs}
.recs-sum{display:flex;gap:16px;flex-wrap:wrap;padding:0 12px 8px;font-size:11.5px;color:var(--muted)}
.recs-sum b{color:var(--fg)}
.recs td,.recs th{padding:6px 8px}
.res-ok{color:var(--up);font-weight:700} .res-bad{color:var(--down);font-weight:700} .res-open{color:var(--accent);font-weight:700}
.src{font-size:10px;font-weight:600;padding:1px 6px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.src.live{background:var(--accent-soft);color:var(--accent)}

/* paper ticket */
.ticket{position:fixed;z-index:96;left:50%;top:50%;transform:translate(-50%,-50%);width:min(360px,calc(100% - 24px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.4);padding:14px;display:grid;gap:10px}
.ticket h3{margin:0;font-size:14px}
.ticket label{display:grid;gap:3px;font-size:11px;color:var(--muted);font-weight:600}
.ticket input,.ticket select{font:inherit;font-size:13px;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.ticket .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ticket .acts{display:flex;gap:8px;justify-content:flex-end}
.scrim{position:fixed;inset:0;z-index:94;background:rgba(0,0,0,.35)}

/* ask claude */
.ai{position:fixed;z-index:97;right:0;top:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-20px 0 50px rgba(0,0,0,.3);display:flex;flex-direction:column}
.ai-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.ai-h h2{margin:0;font-size:14px;flex:1}
.ai-msgs{flex:1;overflow:auto;padding:12px;display:grid;gap:10px;align-content:start}
.msg{padding:9px 11px;border-radius:12px;font-size:13px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.msg.me{background:var(--accent-soft);justify-self:end;max-width:88%}
.msg.ai-m{background:var(--surface-2);max-width:96%}
.ai-sugg{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 8px}
.ai-f{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.ai-f textarea{flex:1;resize:none;font:inherit;font-size:13px;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;height:42px}
.ai-btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:12px;font-weight:600;flex:none}
.ai-btn:hover{border-color:var(--accent)}
@media (max-width:760px){.ai-btn span{display:none}}

      else if (n.layer === 1) { var f = n.f; b = f.long + ' · ' + (f.s == null ? 'inactive' : (f.s > 0 ? '+' : '') + f.s.toFixed(2)); d = f.why + '. ' + (f.counted && P.ic10[f.k] ? 'Backtested: ' + (f.w / totW * 100).toFixed(1) + '% of the score; 10-day IC ' + P.ic10[f.k].train.toFixed(3) + ' train, ' + P.ic10[f.k].test.toFixed(3) + ' test.' : 'Context only, not counted yet.'); }
      else if (n.layer === 2) { b = n.g.label + ' model · ' + (n.g.s == null ? 'no inputs' : (n.g.s > 0 ? '+' : '') + n.g.s.toFixed(2)); d = n.g.ctx ? 'Shown for context, not counted: no history yet to backtest these.' : 'Weighted average of its live criteria. Carries ' + Math.round(n.g.w * 100) + '% of the call.'; }
      else { b = 'Daily model · ' + (S.verdict || 'pending'); d = S.C && S.C.score != null ? 'Score ' + S.C.score.toFixed(3) + '. BUY above ' + P.hi.toFixed(3) + ', SELL below ' + P.lo.toFixed(3) + '.' : 'Waiting for inputs.'; }
      tip.append(el('b', null, b), el('span', null, d)); tip.hidden = false;
      var tw = tip.offsetWidth, th = tip.offsetHeight; tip.style.left = clamp(x + 14, 6, Math.max(6, W - tw - 6)) + 'px'; tip.style.top = clamp(y + 14, 6, Math.max(6, H - th - 6)) + 'px';
    }
    cv.addEventListener('pointermove', function (ev) {
      var r = cv.getBoundingClientRect(); var x = ev.clientX - r.left, y = ev.clientY - r.top;
      var hv = hit(x, y); cv.style.cursor = hv ? 'help' : 'default'; showTip(hv, x, y);
    });
    cv.addEventListener('pointerleave', function () { tip.hidden = true; });
    function theme() { darkMode = isDark(); PAL = darkMode ? PALETTES.dark : PALETTES.light; dirty = true; if (webStill && W) { build(); draw(0); } }
    function start() { theme(); build(); resize(); if (!webStill && !running) { running = true; requestAnimationFrame(frame); } }
    try { new ResizeObserver(function () { resize(); }).observe(wrap); } catch (e) { window.addEventListener('resize', resize); }
    try { new IntersectionObserver(function (en) { visible = en[0].isIntersecting; }).observe(wrap); } catch (e) {}
    return { start: start, resize: resize, update: update, feed: feed, theme: theme };
  })();

  // ---------- theme reactions ----------
  function onTheme() { syncThemeBtn(); Web.theme(); themeChart(); drawChart(false); lastLinesKey = 'x'; S.vKey = ''; runEngine(); Calls.render(true); Recs.render(true); renderDepth(); renderChain(); }
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', onTheme); } catch (e) {}
  new MutationObserver(onTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  // ---------- data adapter ----------
  // In Claude the page talks to the CA Trader connector; on catrader.site the same page calls the app's own API
  // (/api/term/call runs the same tool handlers for the signed-in user). Both expose callTool / watchTool.
  function restAdapter() {
    async function callTool(server, tool, input) {
      var r = await fetch('/api/term/call', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tool: tool, args: input || {} }) });
      if (r.status === 401 || r.status === 403) throw { code: 'needs_login', message: 'Signed out' };
      var j = null; try { j = await r.json(); } catch (e) {}
      if (!r.ok) throw { code: 'tool_error', message: (j && (j.detail || j.error)) || 'HTTP ' + r.status };
      return j;
    }
    function watchTool(server, tool, input, cb, opt) {
      var stopped = false, every = (opt && opt.refetchInterval) || 30000;
      (async function loop() {
        while (!stopped) {
          if (!document.hidden) { try { var d = await callTool(server, tool, input); if (!stopped) cb({ type: 'data', result: d }); } catch (e) { if (!stopped) cb({ type: 'error', error: e }); } }
          await sleep(every);
        }
      })();
      return function () { stopped = true; };
    }
    return { callTool: callTool, watchTool: watchTool, rest: true };
  }
  AUTHZ.needs_login = 'Your CA Trader session has ended. Sign in again at catrader.site, then reload.';

  // ---------- boot ----------
  syncThemeBtn(); initChart();
  var onServer = !(window.claude && window.claude.use) && /^https?:$/.test(location.protocol) && !/claude\.ai$|claudeusercontent\.com$/.test(location.hostname);
  try {
    fetch(onServer ? '/api/model/params' : 'params.json', { cache: 'no-store', credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { if (j && j.criteria && j.quantiles) { P = j; S.vKey = ''; runEngine(); } }).catch(function () {});
  } catch (e) {}
  S.list = load('cat.list') || DEFAULT_LIST.slice();
  S.quotes = load('cat.q') || {}; S.movers = load('cat.mv') || {}; S.session = load('cat.sess');
  var savedTf = load('cat.tf'); if (savedTf && TF_DAYS[savedTf]) S.tf = savedTf;
  document.querySelectorAll('#tfs button').forEach(function (x) { x.setAttribute('aria-pressed', String(x.dataset.tf === S.tf)); });
  var savedSel = load('cat.sel'); S.sel = S.list.find(function (w) { return w.id === savedSel; }) || S.list[0] || DEFAULT_LIST[0];
  var savedView = load('cat.view'); if (savedView) setView(savedView);
  renderSession(); renderTicker(); renderPortfolio(); renderMovers(); renderNews();
  Web.start(); selectSym(S.sel.id); renderPortfolio(); Recs.render(true);
  if (/debug/.test(location.hash)) window.__CAT__ = S;
  Store.init(); AI.init();

  // signal web full screen (Esc closes)
  function setFs(on) {
    $('app').classList.toggle('webfs', on); $('webFs').setAttribute('aria-label', on ? 'Exit full screen' : 'Full screen');
    $('webFsIco').innerHTML = on ? '<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>' : '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>';
    requestAnimationFrame(function () { Web.resize(); });
  }
  $('webFs').addEventListener('click', function () { setFs(!$('app').classList.contains('webfs')); });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && $('app').classList.contains('webfs') && $('ticket').hidden) setFs(false); });
  if (!window.LightweightCharts) chartMsg('Chart library didn’t load. Check your connection and reload.');

  (window.claude && window.claude.use ? window.claude.use('mcp') : Promise.resolve(onServer ? restAdapter() : null)).then(function (mcp) {
    if (!mcp) {
      showBanner('Live data needs the CA Trader connector, which this view can’t reach. Open the page on claude.ai while signed in, or at catrader.site/terminal.');
      $('liveTxt').textContent = 'Offline'; $('beat').className = 'dot off'; if (!S.candles.length) chartMsg('No live data in this view.'); return;
    }
    S.mcp = mcp;
    resolveMcx();
    quoteLoop(); watchGlobal(); watchModelData(); loadCandles(); loadDepth(); loadDaily(); watchSelected(); depthLoop(); candleLoop(); dailyLoop();
    if (!load('cat.list')) {
      call('get_watchlists').then(function (wl) {
        var items = (wl && wl.items && wl.items[0] && wl.items[0].items) || [];
        if (!items.length) return;
        S.list = items.map(function (i) { return { id: i.symbol, label: i.symbol, name: i.display_name || '' }; }); saveList(); renderWatchlist(); S.kick = true;
      }).catch(function () {});
    }
  }, function (e) { showBanner('Couldn’t start live data: ' + errText(e)); });
})();
</script>
