name: Auto-Deploy to Oracle Cloud

on:
  push:
    branches:
      - CA-Trader-Bifurcated

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Oracle Cloud VM & Arrange Server Directory Structure
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd /home/ubuntu/CA-Trader
            git fetch origin CA-Trader-Bifurcated
            git reset --hard origin/CA-Trader-Bifurcated

            # --- ARRANGE SERVER DIRECTORY IN CLEAN GITHUB-ALIGNED STRUCTURE ---
            echo "[*] Organizing server directory structure..."
            mkdir -p data static scripts backups logs docs

            # Clean cache and temporary build artifacts
            find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
            find . -name "*.pyc" -delete 2>/dev/null || true

            # Organize stray data files into data/
            if [ -f "stockmantra_3months.json" ]; then
              cp -u stockmantra_3months.json data/ 2>/dev/null || true
            fi
            if [ -f "stockmantra_telegram_raw.json" ]; then
              mv -f stockmantra_telegram_raw.json data/ 2>/dev/null || true
            fi

            # Automated safety backup and arrangement of SQLite database
            if [ -f "ca_trader.sqlite3" ] && [ ! -L "ca_trader.sqlite3" ]; then
              cp ca_trader.sqlite3 "backups/ca_trader_$(date +%Y%m%d_%H%M%S).sqlite3" 2>/dev/null || true
              cp -u ca_trader.sqlite3 data/ca_trader.sqlite3 2>/dev/null || true
              ls -t backups/ca_trader_*.sqlite3 2>/dev/null | tail -n +8 | xargs -r rm -- 2>/dev/null || true
            elif [ -f "data/ca_trader.sqlite3" ]; then
              cp data/ca_trader.sqlite3 "backups/ca_trader_$(date +%Y%m%d_%H%M%S).sqlite3" 2>/dev/null || true
              ls -t backups/ca_trader_*.sqlite3 2>/dev/null | tail -n +8 | xargs -r rm -- 2>/dev/null || true
            fi

            # Clean any symlink so ca_trader.sqlite3 is a clean regular file everywhere
            if [ -L "ca_trader.sqlite3" ]; then
              rm -f ca_trader.sqlite3
              if [ -f "data/ca_trader.sqlite3" ]; then
                cp -f data/ca_trader.sqlite3 ca_trader.sqlite3 2>/dev/null || true
              fi
            fi
            if [ -f "ca_trader.sqlite3" ] && [ ! -f "data/ca_trader.sqlite3" ]; then
              cp -f ca_trader.sqlite3 data/ca_trader.sqlite3 2>/dev/null || true
            elif [ -f "data/ca_trader.sqlite3" ] && [ ! -f "ca_trader.sqlite3" ]; then
              cp -f data/ca_trader.sqlite3 ca_trader.sqlite3 2>/dev/null || true
            fi

            /home/ubuntu/venv/bin/pip install -r requirements.txt --quiet

            # Run calibrated scripts safely (non-blocking)
            if [ -f "scripts/run_banknifty_backtest.py" ]; then
              echo ">>> EXECUTING BANKNIFTY 5-TIMEFRAME REAL-DATA BACKTEST <<<"
              /home/ubuntu/venv/bin/python3 scripts/run_banknifty_backtest.py || true
            fi
            if [ -f "scripts/reconcile_stockmantra.py" ]; then
              echo ">>> EXECUTING CALIBRATED STOCKMANTRA RECONCILIATION <<<"
              echo "=========================================================="
              /home/ubuntu/venv/bin/python3 scripts/reconcile_stockmantra.py || true
              echo "=========================================================="
            fi

            sudo systemctl daemon-reload 2>/dev/null || true
            sudo systemctl restart catrader
            sleep 4
            if ! sudo systemctl is-active --quiet catrader; then
              echo "[ERROR] catrader service failed to start! Fetching recent logs:"
              journalctl -u catrader -n 40 --no-pager
              exit 1
            fi

            echo ">>> WAITING FOR UVICORN HEALTH (PORT 8000) <<<"
            HEALTH_OK=0
            for i in $(seq 1 15); do
              if curl -s -f http://127.0.0.1:8000/health > /dev/null; then
                echo ">>> LOCAL HEALTH CHECK PASSED (attempt $i) <<<"
                HEALTH_OK=1
                break
              fi
              sleep 2
            done

            if [ "$HEALTH_OK" -eq 0 ]; then
              echo "[ERROR] Health check timed out! Dumping server logs:"
              journalctl -u catrader -n 40 --no-pager
              exit 1
            fi
            echo ">>> DEPLOYMENT & HEALTH CHECK 100% SUCCESSFUL <<<"
