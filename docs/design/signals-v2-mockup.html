<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CA Trader · Signals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f8; --bg-2:#e4e8f3; --surface:#ffffff; --surface-2:#f5f7fc; --ink:#0f1a33; --ink-2:#3a4560; --muted:#7a839a; --line:#e2e6ef; --line-2:#cdd3e0;
  --accent:#3d3bf3; --accent-2:#6d6bff; --accent-soft:rgba(61,59,243,.10); --on-accent:#fff;
  --up:#00a86b; --up-soft:rgba(0,168,107,.12); --dn:#e5484d; --dn-soft:rgba(229,72,77,.12); --warn:#d98a00;
  --shadow-1:0 1px 2px rgba(15,26,51,.05),0 4px 16px rgba(15,26,51,.06);
  --shadow-2:0 2px 6px rgba(15,26,51,.08),0 18px 48px rgba(15,26,51,.14);
  --r-xl:26px; --r-l:18px; --r-m:12px; --r-s:9px;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.4,.5,1);
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --f-display:"Bricolage Grotesque","Manrope",system-ui,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#000000; --bg-2:#050505; --surface:#0c0c0e; --surface-2:#161618; --ink:#f2f2f4; --ink-2:#c8c8ce; --muted:#8b8b94; --line:#212124; --line-2:#323237;
  --accent:#8f8dff; --accent-2:#b3b1ff; --accent-soft:rgba(143,141,255,.15); --on-accent:#000000;
  --up:#2fd796; --up-soft:rgba(47,215,150,.13); --dn:#ff6b70; --dn-soft:rgba(255,107,112,.13); --warn:#ffbb38;
  --shadow-1:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); --shadow-2:0 2px 8px rgba(0,0,0,.5),0 24px 60px rgba(0,0,0,.55);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#000000; --bg-2:#050505; --surface:#0c0c0e; --surface-2:#161618; --ink:#f2f2f4; --ink-2:#c8c8ce; --muted:#8b8b94; --line:#212124; --line-2:#323237;
  --accent:#8f8dff; --accent-2:#b3b1ff; --accent-soft:rgba(143,141,255,.15); --on-accent:#000000;
  --up:#2fd796; --up-soft:rgba(47,215,150,.13); --dn:#ff6b70; --dn-soft:rgba(255,107,112,.13); --warn:#ffbb38;
  --shadow-1:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); --shadow-2:0 2px 8px rgba(0,0,0,.5),0 24px 60px rgba(0,0,0,.55);
  color-scheme:dark; } }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1200px 600px at 50% -200px,var(--bg-2),var(--bg));color:var(--ink);font:15px/1.45 var(--f-ui);
  font-feature-settings:"tnum" 1,"ss01" 1;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
svg{width:20px;height:20px;flex:none}
.up{color:var(--up)} .dn{color:var(--dn)} .muted{color:var(--muted)}
.n{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
[hidden]{display:none!important}

.app{max-width:440px;margin:0 auto;min-height:100vh;padding:0 0 calc(92px + env(safe-area-inset-bottom));position:relative}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5)}
.top-row{display:flex;align-items:center;gap:10px}
.idx{flex:1;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory}
.idx::-webkit-scrollbar{display:none}
.idx button{scroll-snap-align:start;flex:none;display:flex;flex-direction:column;align-items:flex-start;padding:7px 12px;border-radius:14px;background:var(--surface);
  border:1px solid var(--line);min-width:118px;transition:transform .2s var(--spring),border-color .2s}
.idx button:active{transform:scale(.96)}
.idx b{font-size:11px;font-weight:700;color:var(--muted)}
.idx span{font-weight:800;font-size:14px}
.idx i{font-style:normal;font-size:11.5px;font-weight:600}
.icon-btn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);
  transition:transform .2s var(--spring),background .2s}
.icon-btn:active{transform:scale(.9) rotate(-8deg)}
.demo{display:flex;width:max-content;max-width:calc(100% - 32px);align-items:center;gap:6px;margin:10px 16px 0;padding:5px 10px;border-radius:99px;font-size:11.5px;font-weight:700;color:var(--warn);
  background:color-mix(in srgb,var(--warn) 12%,transparent)}

/* ---------- symbol header ---------- */
.sym{padding:14px 16px 4px}
.seg{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-1)}
.seg button{position:relative;z-index:1;padding:8px 16px;font-weight:700;font-size:13.5px;color:var(--muted);transition:color .25s}
.seg button[aria-selected="true"]{color:var(--on-accent)}
.seg .ink{position:absolute;z-index:0;top:4px;bottom:4px;left:4px;border-radius:10px;background:var(--accent);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 40%,transparent);
  transition:transform .4s var(--spring),width .4s var(--spring)}
.price-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:14px}
.big{font:800 44px/1 var(--f-display);letter-spacing:-.03em;font-variation-settings:"opsz" 96;transition:color .3s}
.chg{font-weight:700;font-size:14px;margin-top:6px;display:flex;gap:8px;align-items:center}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--up);box-shadow:0 0 0 0 var(--up);animation:live 2s infinite}
@keyframes live{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--up) 60%,transparent)}80%,100%{box-shadow:0 0 0 7px transparent}}
.spark{width:120px;height:44px}
.spark path{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tick-up{animation:tku .6s} .tick-dn{animation:tkd .6s}
@keyframes tku{30%{color:var(--up);text-shadow:0 0 18px color-mix(in srgb,var(--up) 50%,transparent)}}
@keyframes tkd{30%{color:var(--dn);text-shadow:0 0 18px color-mix(in srgb,var(--dn) 50%,transparent)}}

/* ---------- horizon tabs ---------- */
.hz{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:16px 16px 0}
.hz button{position:relative;text-align:left;padding:10px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);transition:transform .25s var(--spring),border-color .25s,box-shadow .25s}
.hz button:active{transform:scale(.96)}
.hz button[aria-selected="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.hz b{display:block;font-weight:800;font-size:14px}
.hz span{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.hz em{position:absolute;top:10px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--line-2)}
.hz em.BUY{background:var(--up)} .hz em.SELL{background:var(--dn)}

/* ---------- plan card ---------- */
.stage{position:relative;padding:12px 16px 0;overflow:hidden}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow-2);overflow:hidden;position:relative}
.plan.slide-l{animation:sl .42s var(--ease)} .plan.slide-r{animation:sr .42s var(--ease)}
@keyframes sl{from{opacity:0;transform:translateX(40px)}} @keyframes sr{from{opacity:0;transform:translateX(-40px)}}
.plan-h{display:flex;align-items:center;gap:12px;padding:16px 16px 10px}
.ring{--p:50;--c:var(--up);width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:radial-gradient(closest-side,var(--surface) 76%,transparent 78% 100%),conic-gradient(var(--c) calc(var(--p)*1%),var(--surface-2) 0);transition:--p .8s}
.ring b{font:800 16px/1 var(--f-display)}
.ring small{display:block;font-size:9.5px;color:var(--muted);font-weight:700;text-align:center;margin-top:2px}
.plan-h .t{flex:1;min-width:0}
.plan-h .t b{display:block;font:700 20px/1.1 var(--f-display);letter-spacing:-.01em}
.plan-h .t span{font-size:12.5px;color:var(--muted);font-weight:600}
.badge{padding:8px 12px;border-radius:12px;font-weight:800;font-size:13px;letter-spacing:.01em;color:#fff;background:var(--up);position:relative}
.badge.SELL{background:var(--dn)} .badge.NO_TRADE{background:var(--surface-2);color:var(--muted)}
.badge.BUY::after,.badge.SELL::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 0 currentColor;animation:halo 2.4s infinite;color:inherit}
.badge.BUY::after{color:var(--up)} .badge.SELL::after{color:var(--dn)}
@keyframes halo{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 50%,transparent)}75%,100%{box-shadow:0 0 0 9px transparent}}

/* vertical ladder — the hero */
.ladder-wrap{display:grid;grid-template-columns:1fr 132px;gap:14px;padding:4px 16px 14px;align-items:stretch}
.ladder{position:relative;height:230px;border-radius:18px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.ladder .band{position:absolute;left:0;right:0;transform-origin:top;transition:top .6s var(--ease),height .6s var(--ease)}
.ladder .risk{background:linear-gradient(180deg,transparent,var(--dn-soft))}
.ladder .reward{background:linear-gradient(0deg,transparent,var(--up-soft))}
.ladder .zone{left:10px;right:10px;border-radius:8px;background:repeating-linear-gradient(135deg,var(--accent-soft) 0 6px,transparent 6px 12px);border:1.5px solid var(--accent)}
.lvl{position:absolute;left:0;right:0;height:0;transition:top .6s var(--ease)}
.lvl::before{content:"";position:absolute;left:0;right:0;border-top:1.5px dashed var(--c,var(--line-2))}
.lvl span{position:absolute;left:10px;top:-10px;padding:2px 7px;border-radius:7px;font-size:11px;font-weight:800;color:#fff;background:var(--c)}
.lvl.T1,.lvl.T2{--c:var(--up)} .lvl.SL{--c:var(--dn)}
.ltp{position:absolute;right:10px;transform:translateY(-50%);transition:top .7s var(--spring);z-index:3;display:flex;align-items:center;gap:6px}
.ltp b{padding:4px 8px;border-radius:9px;background:var(--ink);color:var(--surface);font-size:12px;font-weight:800;box-shadow:var(--shadow-1)}
.ltp i{width:10px;height:10px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 4px color-mix(in srgb,var(--ink) 18%,transparent)}
.ladder.draw .band,.ladder.draw .lvl{animation:drawin .7s var(--ease) both}
.ladder.draw .lvl:nth-child(5){animation-delay:.08s} .ladder.draw .lvl:nth-child(6){animation-delay:.16s} .ladder.draw .lvl:nth-child(7){animation-delay:.24s}
@keyframes drawin{from{opacity:0;transform:scaleX(.2)}}
.levels{display:flex;flex-direction:column;gap:6px}
.lv{flex:1;display:flex;flex-direction:column;justify-content:center;padding:6px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  transition:transform .2s var(--spring),border-color .2s}
.lv:hover{border-color:var(--line-2)}
.lv span{font-size:10.5px;font-weight:700;color:var(--muted)}
.lv b{font-size:14.5px;font-weight:800}
.lv.flash{animation:pop .5s var(--spring)}
@keyframes pop{40%{transform:scale(1.05)}}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px}
.tile{padding:10px 12px;border-radius:14px;background:var(--surface-2)}
.tile span{display:block;font-size:11px;color:var(--muted);font-weight:700}
.tile b{display:block;font:800 17px/1.2 var(--f-display);margin-top:2px}
.tile small{font-size:11px;color:var(--muted);font-weight:600}
.timebar{height:4px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}
.timebar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width 1s linear}
.timebar.low i{background:var(--dn)}

.steps{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 2px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{flex:none;display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink-2)}
.step svg{width:15px;height:15px;color:var(--accent)}

/* option */
.opt{margin:12px 16px 0;border-radius:20px;padding:14px;background:linear-gradient(160deg,var(--accent-soft),transparent 60%),var(--surface-2);border:1px solid var(--line)}
.opt-h{display:flex;align-items:center;gap:8px}
.opt-h b{font:700 16px/1.1 var(--f-display);margin-right:auto;white-space:nowrap}
.opt-h small{font:600 12px var(--f-ui)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:700}
.opt-lv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.opt-lv div{padding:7px 8px;border-radius:11px;background:var(--surface);border:1px solid var(--line)}
.opt-lv span{display:block;font-size:10.5px;font-weight:700;color:var(--muted)}
.opt-lv b{display:block;font-size:13.5px;font-weight:800}
.cta{position:relative;overflow:hidden;width:100%;height:52px;border-radius:16px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:15.5px;
  display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 35%,transparent);transition:transform .2s var(--spring),box-shadow .2s}
.cta:hover{box-shadow:0 14px 30px color-mix(in srgb,var(--accent) 45%,transparent)}
.cta:active{transform:scale(.97)}
.cta svg{transition:transform .25s var(--ease)} .cta:hover svg{transform:translateX(4px)}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}

.pills{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px 0}
.pill{padding:5px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--ink-2)}
.pill.up{background:var(--up-soft);color:var(--up)} .pill.dn{background:var(--dn-soft);color:var(--dn)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 16px 0}
.stat{text-align:center;padding:10px 4px;border-radius:14px;border:1px solid var(--line)}
.stat b{display:block;font:800 18px/1.15 var(--f-display)}
.stat span{font-size:11px;color:var(--muted);font-weight:700}
.stats-note{text-align:center;font-size:11.5px;color:var(--muted);padding:6px 16px 0}

.why{margin-top:12px;border-top:1px solid var(--line)}
.why summary{list-style:none;display:flex;align-items:center;justify-content:center;gap:6px;padding:14px;font-weight:700;font-size:13.5px;color:var(--accent);cursor:pointer}
.why summary::-webkit-details-marker{display:none}
.why summary svg{transition:transform .3s var(--ease)} .why[open] summary svg{transform:rotate(180deg)}
.why-body{padding:0 16px 16px;display:grid;gap:9px}
.fx{display:grid;grid-template-columns:92px 1fr 36px;align-items:center;gap:10px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.fx-bar{position:relative;height:8px;border-radius:8px;background:var(--surface-2)}
.fx-bar::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1.5px;background:var(--line-2)}
.fx-bar i{position:absolute;top:0;bottom:0;border-radius:8px;width:0;transition:width .7s var(--ease),left .7s var(--ease)}
.fx b{text-align:right}
.why p{margin:6px 0 0;font-size:13px;color:var(--muted)}

.empty{padding:22px 16px 26px;text-align:center}
.empty b{display:block;font:700 18px/1.2 var(--f-display);margin-bottom:4px}

/* next session */
.next{margin:14px 16px 0;padding:16px;border-radius:var(--r-xl);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-1);display:flex;gap:14px;align-items:center}
.next .ring{width:66px;height:66px;--c:var(--accent)}
.next h3{margin:0 0 2px;font:700 16px/1.2 var(--f-display)}
.next p{margin:0;font-size:12.5px;color:var(--muted)}
.range{display:flex;gap:6px;margin-top:8px}

/* tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(408px,calc(100% - 24px));z-index:40;
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px;border-radius:24px;background:color-mix(in srgb,var(--surface) 82%,transparent);
  backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:1px solid var(--line);box-shadow:var(--shadow-2)}
.tabbar button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;font-size:10.5px;font-weight:700;color:var(--muted);transition:color .25s}
.tabbar button svg{transition:transform .3s var(--spring)}
.tabbar button[aria-current="page"]{color:var(--accent)} .tabbar button[aria-current="page"] svg{transform:translateY(-2px) scale(1.08)}
.tabbar .ink{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:18px;background:var(--accent-soft);transition:transform .45s var(--spring)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:60;max-height:92vh;overflow:auto;width:min(440px,100%);transform:translate(-50%,105%);transition:transform .45s var(--spring);
  background:var(--surface);border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:var(--shadow-2)}
.sheet.on{transform:translate(-50%,0)}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line-2);margin:0 auto 14px}
.sheet h2{margin:0;font:700 22px/1.15 var(--f-display)}
.sheet .sub{color:var(--muted);font-size:13px;margin-top:2px}
.mode{margin-top:14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.field{padding:10px 12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.field span{display:block;font-size:11px;font-weight:700;color:var(--muted)}
.field input{width:100%;border:0;background:none;color:var(--ink);font:800 17px/1.3 var(--f-ui);font-feature-settings:"tnum" 1;padding:0;outline:none}
.stepper{display:flex;align-items:center;justify-content:space-between}
.stepper button{width:30px;height:30px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-weight:800;transition:transform .15s var(--spring)}
.stepper button:active{transform:scale(.85)}
.stepper b{font-size:17px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.sum div{padding:9px;border-radius:12px;text-align:center;background:var(--surface-2)}
.sum span{display:block;font-size:10.5px;font-weight:700;color:var(--muted)}
.sum b{font-size:14px;font-weight:800}
.swipe{position:relative;margin-top:16px;height:58px;border-radius:20px;background:var(--up-soft);overflow:hidden;user-select:none;touch-action:none}
.swipe .fill{position:absolute;left:0;top:0;bottom:0;width:58px;background:var(--up);border-radius:20px;opacity:.25}
.swipe .label{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;color:var(--up);font-size:14.5px;letter-spacing:.01em}
.swipe .label{background:linear-gradient(90deg,var(--up) 40%,color-mix(in srgb,var(--up) 40%,transparent) 50%,var(--up) 60%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 2.6s linear infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
.swipe .knob{position:absolute;left:4px;top:4px;width:50px;height:50px;border-radius:16px;background:var(--up);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px color-mix(in srgb,var(--up) 45%,transparent);cursor:grab;z-index:2}
.swipe.done .knob{transition:left .3s var(--ease)}
.swipe.reset .knob,.swipe.reset .fill{transition:left .35s var(--spring),width .35s var(--spring)}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));z-index:70;transform:translate(-50%,20px) scale(.96);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:16px;background:var(--ink);color:var(--surface);font-weight:700;font-size:14px;box-shadow:var(--shadow-2);
  transition:opacity .3s,transform .4s var(--spring)}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
.toast svg{color:var(--up)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>
(() => {
"use strict";
const $ = (id) => document.getElementById(id);
const fmt = (v, d = 2) => Number(v).toLocaleString("en-IN", { minimumFractionDigits: d, maximumFractionDigits: d });

const hhmm = (t) => new Date(t).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", hour12: false });

/* ---------------- demo data (shaped like /api/signals) ---------------- */
const now = Date.now();
const mk = (o) => ({ ...o, valid_from: now - 3 * 60e3, valid_until: now + o.mins * 60e3 });
const DATA = {
  NIFTY: { prev: 22997.35, ltp: 23117.15, plans: [

      factors: { Trend: 62, VWAP: 48, Momentum: 71, "Price action": 40, "Day change": 22, "Option flow": -12 }, htf: [["5m", 1], ["15m", 1]],
      opt: { name: "23100 CE", exp: "19 Oct", ltp: 104.05, delta: 0.53, lo: 103.04, hi: 104.05, sl: 100.44, t1: 106.12, t2: 109.93 }, bt: { t1: 63, r: 0.14, n: 400, from: "21 Sep", to: "16 Oct" } }),
    mk({ key: "intraday", label: "Intraday", tf: "5m", hold: "30 min–2 h", decision: "BUY", score: 44, mins: 34, entry_low: 23108.00, entry_high: 23114.50, sl: 23092.10, t1: 23138.40, t2: 23161.80, rr: 1.52, bars: 18,
      factors: { Trend: 58, VWAP: 41, Momentum: 39, "Price action": 47, "Day change": 22, "Option flow": 6 }, htf: [["15m", 1], ["1h", 0]],
      opt: { name: "23100 CE", exp: "19 Oct", ltp: 104.05, delta: 0.53, lo: 98.20, hi: 101.70, sl: 90.10, t1: 113.90, t2: 126.70 }, bt: { t1: 58, r: 0.21, n: 186, from: "21 Sep", to: "16 Oct" } }),
    mk({ key: "swing", label: "Swing", tf: "1h", hold: "1–2 days", decision: "NO_TRADE", score: 12, mins: 0, reason: "Score +12 sits inside the ±30 no-trade band. Wait for the trend and momentum to agree.",
      factors: { Trend: 18, VWAP: 9, Momentum: -4, "Price action": 15, "Day change": 22, "Option flow": 0 }, htf: [["1d", 0]] }),
  ], next: { p: 57, gap: 52, lo: 22980, hi: 23260, cov: 71 } },
  BANKNIFTY: { prev: 55810.5, ltp: 55718.5, plans: [
    mk({ key: "scalp", label: "Scalp", tf: "1m", hold: "10–25 min", decision: "SELL", score: -48, mins: 6, entry_low: 55712.0, entry_high: 55722.0, sl: 55741.5, t1: 55690.0, t2: 55662.0, rr: 0.92, bars: 25,
      factors: { Trend: -51, VWAP: -44, Momentum: -60, "Price action": -38, "Day change": -16, "Option flow": 10 }, htf: [["5m", -1], ["15m", -1]],
      opt: { name: "55700 PE", exp: "28 Oct", ltp: 312.4, delta: -0.48, lo: 309.5, hi: 314.3, sl: 300.1, t1: 324.9, t2: 338.2 }, bt: { t1: 60, r: 0.11, n: 352, from: "21 Sep", to: "16 Oct" } }),
    mk({ key: "intraday", label: "Intraday", tf: "5m", hold: "30 min–2 h", decision: "NO_TRADE", score: -18, mins: 0, reason: "Score −18 is inside the no-trade band. 15m trend is still up.",
      factors: { Trend: -10, VWAP: -22, Momentum: -30, "Price action": -5, "Day change": -16, "Option flow": 4 }, htf: [["15m", 1], ["1h", 0]] }),
    mk({ key: "swing", label: "Swing", tf: "1h", hold: "1–2 days", decision: "NO_TRADE", score: 5, mins: 0, reason: "No clear direction on the hourly chart.",
      factors: { Trend: 8, VWAP: -3, Momentum: 2, "Price action": 6, "Day change": -16, "Option flow": 0 }, htf: [["1d", 1]] }),
  ], next: { p: 46, gap: 44, lo: 55420, hi: 56080, cov: 68 } },
};
const IDX = [["NIFTY 50", "NIFTY"], ["BANK NIFTY", "BANKNIFTY"], ["SENSEX", null, 75836.4, 0.41], ["INDIA VIX", null, 11.92, -3.1]];
const hist = {}; Object.keys(DATA).forEach((k) => { const d = DATA[k], a = [d.ltp]; for (let i = 0; i < 39; i++) a.unshift(a[0] - (d.ltp - d.prev) / 40 + (Math.random() - 0.5) * Math.abs(d.ltp - d.prev) / 12); hist[k] = a; });

const S = { sym: "NIFTY", hz: 0, open: new Set() };

/* ---------------- segmented controls ---------------- */
function seg(el, items, sel, onPick) {
  el.querySelectorAll("button").forEach((b) => b.remove());
  items.forEach(([label, val]) => { const b = document.createElement("button"); b.role = "tab"; b.textContent = label; b.dataset.v = val; b.setAttribute("aria-selected", String(val === sel)); el.appendChild(b); });
  moveInk(el);
  el.onclick = (e) => { const b = e.target.closest("button[data-v]"); if (!b) return; el.querySelectorAll("button").forEach((x) => x.setAttribute("aria-selected", String(x === b))); moveInk(el); onPick(b.dataset.v); };
}
function moveInk(el) { const b = el.querySelector('button[aria-selected="true"]'), ink = el.querySelector(".ink"); if (!b || !ink) return; ink.style.width = b.offsetWidth + "px"; ink.style.transform = `translateX(${b.offsetLeft - 4}px)`; }

/* ---------------- header ---------------- */
function renderIdx() {
  $("idx").innerHTML = IDX.map(([l, s, v, c]) => { const ltp = s ? DATA[s].ltp : v, ch = s ? ((DATA[s].ltp - DATA[s].prev) / DATA[s].prev) * 100 : c;
    return `<button data-s="${s || ""}"><b>${l}</b><span class="n">${fmt(ltp)}</span><i class="n ${ch >= 0 ? "up" : "dn"}">${sgn(ch)}%</i></button>`; }).join("");
}
$("idx").addEventListener("click", (e) => { const b = e.target.closest("button[data-s]"); if (b && b.dataset.s) pickSym(b.dataset.s); });
function renderQuote(dir) {
  const d = DATA[S.sym], ch = d.ltp - d.prev, pct = (ch / d.prev) * 100, el = $("ltp");
  el.textContent = fmt(d.ltp); el.className = `big n ${ch >= 0 ? "up" : "dn"}`;
  if (dir) { el.classList.remove("tick-up", "tick-dn"); void el.offsetWidth; el.classList.add(dir > 0 ? "tick-up" : "tick-dn"); }
  $("chg").innerHTML = `<span class="${ch >= 0 ? "up" : "dn"}">${sgn(ch)} (${sgn(pct)}%)</span>`;
  const h = hist[S.sym], lo = Math.min(...h), hi = Math.max(...h);
  $("sparkPath").setAttribute("d", h.map((v, i) => `${i ? "L" : "M"}${(i / (h.length - 1)) * 120},${40 - ((v - lo) / (hi - lo || 1)) * 36}`).join(""));
  $("sparkPath").style.stroke = ch >= 0 ? "var(--up)" : "var(--dn)";
}

/* ---------------- horizons + plan ---------------- */
function renderHz() {
  $("hz").innerHTML = DATA[S.sym].plans.map((p, i) => `<button role="tab" aria-selected="${i === S.hz}" data-i="${i}"><em class="${p.decision}"></em><b>${p.label}</b><span>${p.tf} chart</span></button>`).join("");
}
$("hz").addEventListener("click", (e) => { const b = e.target.closest("button[data-i]"); if (!b) return; const i = +b.dataset.i; if (i === S.hz) return; const dir = i > S.hz ? "l" : "r"; S.hz = i; renderHz(); renderPlan(dir); });

const isOpt = () => true;
function renderPlan(dir, draw) {
  const d = DATA[S.sym], p = d.plans[S.hz], live = p.decision !== "NO_TRADE", buy = p.decision === "BUY";
  const sideLbl = live ? `${p.decision} · ${buy ? "CE" : "PE"}` : "No trade";
  const ringC = live ? (buy ? "var(--up)" : "var(--dn)") : "var(--line-2)";
  const factors = Object.entries(p.factors).map(([k, v]) => `<div class="fx"><span>${k}</span><span class="fx-bar"><i data-v="${v}" style="background:${v >= 0 ? "var(--up)" : "var(--dn)"};left:50%"></i></span><b class="n ${v >= 0 ? "up" : "dn"}">${sgn(v, 0)}</b></div>`).join("");
  const why = `<details class="why" data-k="${S.sym}${p.key}" ${S.open.has(S.sym + p.key) ? "open" : ""}><summary>Why this signal<svg><use href="#i-down"/></svg></summary><div class="why-body">${factors}
    ${live ? `<p>Enter in the zone before the timer ends. If price never reaches it, skip the trade. Book part at T1, trail the rest to T2, and exit after ${p.bars} ${p.tf} bars if T1 has not come.</p>` : ""}</div></details>`;
  let html = `<article class="plan ${dir ? "slide-" + dir : ""}">
    <div class="plan-h"><div class="ring" style="--p:${Math.abs(p.score)};--c:${ringC}"><div><b class="n">${sgn(p.score, 0)}</b><small>score</small></div></div>
      <div class="t"><b>${p.label}</b><span>Hold ${p.hold}</span></div><span class="badge ${p.decision}">${sideLbl}</span></div>`;
  if (!live) {
    html += `<div class="empty"><b>Sit this one out</b><span class="muted">${p.reason}</span></div>
      <div class="pills">${p.htf.map(([t, b]) => `<span class="pill ${b > 0 ? "up" : b < 0 ? "dn" : ""}">${t} ${b > 0 ? "▲" : b < 0 ? "▼" : "•"}</span>`).join("")}</div>${why}</article>`;
    $("stage").innerHTML = html; afterRender(); return;
  }
  html += `<div class="ladder-wrap"><div class="ladder ${draw ? "draw" : ""}" id="ladder"></div>
      <div class="levels">${[["Target 2", p.t2, "up"], ["Target 1", p.t1, "up"], ["Entry zone", buy ? p.entry_low : p.entry_high, ""], ["Stop loss", p.sl, "dn"]]
        .sort((a, b) => b[1] - a[1]).map(([k, v, c]) => `<div class="lv"><span>${k}</span><b class="n ${c}">${fmt(v)}</b></div>`).join("")}</div></div>
    <div class="tiles">
      <div class="tile"><span>Reward : risk</span><b class="n">${p.rr.toFixed(2)}<small> : 1</small></b></div>
      <div class="tile"><span>To entry</span><b class="n" id="dist">—</b></div>
      <div class="tile"><span>Time left</span><b class="n" id="left">—</b><div class="timebar" id="tbar"><i></i></div></div>
    </div>
    <div class="steps">
      <span class="step"><svg><use href="#i-clock"/></svg>Enter by ${hhmm(p.valid_until)}</span>
      <span class="step"><svg><use href="#i-cut"/></svg>Book part at T1</span>
      <span class="step"><svg><use href="#i-trail"/></svg>Trail to T2</span>
      <span class="step"><svg><use href="#i-stop"/></svg>Exit after ${p.bars} bars</span>
    </div>
    <div class="opt"><div class="opt-h"><b>${p.opt.name} <small class="muted">${p.opt.exp}</small></b><span class="chip">LTP <span class="n">${fmt(p.opt.ltp)}</span></span><span class="chip">Δ <span class="n">${p.opt.delta.toFixed(2)}</span></span></div>
      <div class="opt-lv"><div><span>Buy</span><b class="n">${fmt(p.opt.hi)}</b></div><div><span>SL</span><b class="n dn">${fmt(p.opt.sl)}</b></div><div><span>T1</span><b class="n up">${fmt(p.opt.t1)}</b></div><div><span>T2</span><b class="n up">${fmt(p.opt.t2)}</b></div></div>
      <button class="cta" id="tradeBtn">Buy ${p.opt.name}<svg><use href="#i-arrow"/></svg></button></div>
    <div class="pills">${p.htf.map(([t, b]) => `<span class="pill ${b > 0 ? "up" : b < 0 ? "dn" : ""}">${t} ${b > 0 ? "▲" : b < 0 ? "▼" : "•"}</span>`).join("")}</div>
    <div class="stats"><div class="stat"><b class="n">${p.bt.t1}%</b><span>Hit T1 first</span></div><div class="stat"><b class="n ${p.bt.r >= 0 ? "up" : "dn"}">${sgn(p.bt.r)}R</b><span>Avg per trade</span></div><div class="stat"><b class="n">${p.bt.n}</b><span>Past signals</span></div></div>
    <div class="stats-note">Backtest ${p.bt.from} – ${p.bt.to}</div>
    ${why}</article>`;
  $("stage").innerHTML = html; drawLadder(); afterRender();
}
function afterRender() {
  const det = $("stage").querySelector("details");
  if (det) { const anim = () => det.querySelectorAll(".fx-bar i").forEach((i) => { const v = +i.dataset.v; i.style.width = det.open ? Math.abs(v) / 2 + "%" : "0"; i.style.left = det.open && v < 0 ? 50 + v / 2 + "%" : "50%"; });
    det.addEventListener("toggle", () => { det.open ? S.open.add(det.dataset.k) : S.open.delete(det.dataset.k); requestAnimationFrame(anim); }); if (det.open) requestAnimationFrame(anim); }
  const t = $("tradeBtn"); if (t) t.addEventListener("click", (e) => { ripple(e, t); setTimeout(openSheet, 120); });
  tickTimers();
}
function scaleOf(p) { const vals = [p.sl, p.t2, p.entry_low, p.entry_high, DATA[S.sym].ltp]; const lo = Math.min(...vals), hi = Math.max(...vals), pad = (hi - lo) * 0.1; return { lo: lo - pad, hi: hi + pad }; }
function drawLadder() {
  const p = DATA[S.sym].plans[S.hz], L = $("ladder"); if (!L) return;
  const { lo, hi } = scaleOf(p), y = (v) => ((hi - v) / (hi - lo)) * 100;
  const zTop = y(Math.max(p.entry_low, p.entry_high)), zBot = y(Math.min(p.entry_low, p.entry_high));
  const buy = p.decision === "BUY";
  const riskTop = buy ? zBot : y(p.sl), riskBot = buy ? y(p.sl) : zTop;
  const rewTop = buy ? y(p.t2) : zBot, rewBot = buy ? zTop : y(p.t2);
  L.innerHTML = `<div class="band risk" style="top:${riskTop}%;height:${riskBot - riskTop}%"></div>
    <div class="band reward" style="top:${rewTop}%;height:${rewBot - rewTop}%"></div>
    <div class="band zone" style="top:${zTop}%;height:${Math.max(2.5, zBot - zTop)}%"></div>
    <div style="display:none"></div>
    <div class="lvl SL" style="top:${y(p.sl)}%"><span>SL</span></div>
    <div class="lvl T1" style="top:${y(p.t1)}%"><span>T1</span></div>
    <div class="lvl T2" style="top:${y(p.t2)}%"><span>T2</span></div>
    <div class="ltp" id="ltpPin"><b class="n" id="ltpPinV"></b><i></i></div>`;
  moveLtp();
}
function moveLtp() {
  const p = DATA[S.sym].plans[S.hz], pin = $("ltpPin"); if (!pin || p.decision === "NO_TRADE") return;
  const { lo, hi } = scaleOf(p), v = DATA[S.sym].ltp; pin.style.top = Math.max(4, Math.min(96, ((hi - v) / (hi - lo)) * 100)) + "%"; $("ltpPinV").textContent = fmt(v);
  const buy = p.decision === "BUY", inZone = v >= p.entry_low && v <= p.entry_high;
  const dist = inZone ? 0 : buy ? (v > p.entry_high ? v - p.entry_high : v - p.entry_low) : (v < p.entry_low ? p.entry_low - v : p.entry_high - v);
  const de = $("dist"); if (de) { de.textContent = inZone ? "In zone" : `${fmt(Math.abs(dist))} pts`; de.className = `n ${inZone ? "up" : ""}`; }
}
function tickTimers() {
  const p = DATA[S.sym].plans[S.hz]; if (p.decision === "NO_TRADE" || !$("left")) return;
  const left = (p.valid_until - Date.now()) / 1000, total = (p.valid_until - p.valid_from) / 1000;
  $("left").textContent = left <= 0 ? "Expired" : `${Math.floor(left / 60)}m ${String(Math.floor(left % 60)).padStart(2, "0")}s`;
  $("left").className = `n ${left < 120 ? "dn" : ""}`;
  const bar = $("tbar"); bar.querySelector("i").style.width = Math.max(0, (left / total) * 100) + "%"; bar.classList.toggle("low", left < 120);
}

/* ---------------- next session ---------------- */
function renderNext() {
  const n = DATA[S.sym].next;
  $("next").innerHTML = `<div class="ring" style="--p:${n.p}"><div><b class="n">${n.p}%</b><small>higher</small></div></div>
    <div><h3>Next session</h3><p>Chance of a higher close · gap-up ${n.gap}%</p>
    <div class="range"><span class="pill n">Low ${fmt(n.lo, 0)}</span><span class="pill n">High ${fmt(n.hi, 0)}</span><span class="pill">Range hit ${n.cov}%</span></div></div>`;
}

/* ---------------- symbol switch ---------------- */
function pickSym(s) { if (s === S.sym) return; S.sym = s; S.hz = 0; seg($("symSeg"), Object.keys(DATA).map((k) => [k, k]), S.sym, pickSym); renderQuote(); renderHz(); renderPlan("l", true); renderNext(); }

/* ---------------- order sheet ---------------- */
let mode = "paper";
function openSheet() {
  const p = DATA[S.sym].plans[S.hz]; if (!p.opt) return;
  $("shTitle").textContent = `Buy ${p.opt.name}`; $("shSub").textContent = `${S.sym} · expiry ${p.opt.exp} · ${p.label.toLowerCase()} plan`;
  $("px").value = p.opt.hi.toFixed(2); $("sl").value = p.opt.sl.toFixed(2); $("lots").textContent = "1";
  $("scrim").classList.add("on"); $("sheet").classList.add("on"); requestAnimationFrame(() => moveInk($("modeSeg"))); calc(); resetSwipe();
}
function closeSheet() { $("scrim").classList.remove("on"); $("sheet").classList.remove("on"); }
$("scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });
function calc() {
  const p = DATA[S.sym].plans[S.hz], q = (+$("lots").textContent || 0) * (+$("lotSize").value || 0), px = +$("px").value || 0, sl = +$("sl").value || 0;
  $("sVal").textContent = "₹" + fmt(px * q, 0); $("sRisk").textContent = "₹" + fmt(Math.abs(px - sl) * q, 0); $("sRew").textContent = "₹" + fmt(Math.abs(p.opt.t1 - px) * q, 0);
  $("swLabel").textContent = mode === "live" ? "Swipe to send live buy" : "Swipe to place paper buy";
}
["lotSize", "px", "sl"].forEach((id) => $(id).addEventListener("input", calc));
$("lotPlus").onclick = () => { $("lots").textContent = Math.min(50, +$("lots").textContent + 1); calc(); };
$("lotMinus").onclick = () => { $("lots").textContent = Math.max(1, +$("lots").textContent - 1); calc(); };
$("modeSeg").addEventListener("click", (e) => { const b = e.target.closest("button[data-m]"); if (!b) return; mode = b.dataset.m; $("modeSeg").querySelectorAll("button").forEach((x) => x.setAttribute("aria-selected", String(x === b))); moveInk($("modeSeg")); calc(); });

/* swipe to confirm */
(() => {
  const sw = $("swipe"), k = $("knob"), f = $("swFill"); let x0 = null, max = 0, x = 0;
  const set = (v) => { x = v; k.style.left = 4 + v + "px"; f.style.width = 58 + v + "px"; };
  k.addEventListener("pointerdown", (e) => { x0 = e.clientX - x; max = sw.clientWidth - 58; sw.classList.remove("reset"); k.setPointerCapture(e.pointerId); });
  k.addEventListener("pointermove", (e) => { if (x0 === null) return; set(Math.max(0, Math.min(max, e.clientX - x0))); });
  k.addEventListener("pointerup", () => { if (x0 === null) return; x0 = null; if (x > max * 0.85) confirmOrder(); else { sw.classList.add("reset"); set(0); } });
  sw.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); max = sw.clientWidth - 58; sw.classList.add("reset"); set(max); setTimeout(confirmOrder, 300); } });
  window.resetSwipe = () => { sw.classList.add("reset"); set(0); };
})();
function confirmOrder() {
  const p = DATA[S.sym].plans[S.hz]; try { navigator.vibrate && navigator.vibrate([10, 40, 10]); } catch (e) {}
  closeSheet(); toast(`${mode === "live" ? "Live" : "Paper"} buy placed · ${$("lots").textContent} lot ${p.opt.name}`);
}
function toast(m) { $("toastMsg").textContent = m; const t = $("toast"); t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2800); }
function ripple(e, el) { const r = el.getBoundingClientRect(), s = document.createElement("span"), d = Math.max(r.width, r.height);
  s.className = "ripple"; s.style.cssText = `width:${d}px;height:${d}px;left:${(e.clientX || r.left + r.width / 2) - r.left - d / 2}px;top:${(e.clientY || r.top + r.height / 2) - r.top - d / 2}px`; el.appendChild(s); setTimeout(() => s.remove(), 650); }

/* ---------------- tab bar & theme ---------------- */
document.querySelectorAll(".tabbar button").forEach((b) => b.addEventListener("click", () => {
  document.querySelectorAll(".tabbar button").forEach((x) => x.removeAttribute("aria-current")); b.setAttribute("aria-current", "page");
  $("tabInk").style.transform = `translateX(${+b.dataset.t * 100}%)`; if (b.dataset.t !== "1") toast(`${b.textContent.trim()} is not part of this demo`);
}));
$("tabInk").style.transform = "translateX(100%)";
$("theme").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const go = () => { document.documentElement.dataset.theme = dark ? "light" : "dark"; };
  document.startViewTransition ? document.startViewTransition(go) : go();
});

/* ---------------- simulated ticks ---------------- */
setInterval(() => {
  Object.keys(DATA).forEach((k) => { const d = DATA[k], p = d.plans[0], anchor = (p.entry_low + p.entry_high) / 2;
    const step = (Math.random() - 0.5) * (k === "NIFTY" ? 2.4 : 6) + (anchor - d.ltp) * 0.04; const old = d.ltp; d.ltp = +(d.ltp + step).toFixed(2);
    hist[k].push(d.ltp); hist[k].shift(); if (k === S.sym) { renderQuote(d.ltp - old); moveLtp(); } });
  renderIdx();
}, 1500);
setInterval(tickTimers, 1000);

/* ---------------- boot ---------------- */
seg($("symSeg"), Object.keys(DATA).map((k) => [k, k]), S.sym, pickSym);
renderIdx(); renderQuote(); renderHz(); renderPlan(null, true); renderNext();
addEventListener("resize", () => { moveInk($("symSeg")); moveInk($("modeSeg")); });
})();
</script>
</body>
</html>
